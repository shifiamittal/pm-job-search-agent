    evidence_rules:
      - Interview Questions contains a mixture of real experience, interview framing, and potentially hypothetical/preparatory material.
      - Do not automatically treat every statement in it as confirmed experience.
      - Claims clearly written as first-person descriptions of completed work may be extracted as candidate evidence.
      - Claims that appear hypothetical, aspirational, suggested, educational, or framed as "how I would..." must NOT be treated as completed experience.
      - Evidence found only in Interview Questions should initially be marked SUPPORTED or NEEDS_CONFIRMATION unless it is unambiguously a factual description of completed work.
      - If the same claim appears in an authoritative project source, the authoritative source takes precedence.
      - If Interview Questions conflicts with an authoritative source, flag the conflict rather than resolving it.
      - This document is especially valuable for surfacing older Keystone work that has not yet been consolidated into dedicated project documents.
